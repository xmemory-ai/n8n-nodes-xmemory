name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push the version tag
      id-token: write   # required for npm Trusted Publishing and provenance

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # No `registry-url`: it writes an .npmrc that authenticates with
      # NODE_AUTH_TOKEN, and publishing here goes through Trusted Publishing.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install an npm that supports Trusted Publishing
        # Trusted Publishing needs npm 11.5.1 or newer. Pinned so two runs
        # publish with the same tooling, whatever npm the Node image ships.
        run: npm install --global --ignore-scripts npm@11.20.0

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists — bump the version in package.json (via PR) before publishing."
            exit 1
          fi
          echo "Tag $VERSION does not exist; proceeding to publish."

      - name: Install dependencies
        run: npm ci

      - name: Run codex check
        run: npm run check:codex

      - name: Release and publish to npm
        # Trusted Publishing, so no token is stored: npm's trusted publisher for
        # n8n-nodes-xmemory names this repository and publish.yml, so renaming
        # either breaks publishing. Under GitHub Actions `n8n-node release` runs
        # lint, build and `npm publish` with provenance.
        run: npm run release

      - name: Tag the published version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # `npm run release` may already create the tag (release-it); only tag/push if it didn't.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already on remote; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Print published version
        run: echo "Published ${{ steps.version.outputs.version }}"
